# LabLDAP continuous integration (T-004, T-007 wiring).
#
# Required PR gate: static, unit, frontend, security, integration (389),
# integration-native. image-bootstrap and make image are required.
# SBOM/provenance is the sbom job.
#
# Caches are only the Go module/build cache and the pnpm store.
# Do not add cache paths that include /secrets, .env, or credential files.
# Do not print secrets, tokens, or secret-file contents. Do not upload
# credential files, /secrets, or .env as artifacts.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# One run per ref. Rapid docs/CI pushes were stacking 25-minute
# integration jobs; only the latest commit matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.26.5
  GOPROXY: https://proxy.golang.org,direct
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  # Docs-only pushes skip Docker-heavy jobs. Native integration is a
  # second, cheaper gate: only when native LDAP paths change.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; then
            echo "heavy=true" >> "${GITHUB_OUTPUT}"
            echo "native=true" >> "${GITHUB_OUTPUT}"
            echo "no prior SHA; run integration, native integration, and image"
            exit 0
          fi
          if ! files=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${base}...${head}" --jq '.files[].filename'); then
            echo "heavy=true" >> "${GITHUB_OUTPUT}"
            echo "native=true" >> "${GITHUB_OUTPUT}"
            echo "compare failed; run integration, native integration, and image"
            exit 0
          fi
          printf '%s\n' "${files}"
          list=$(mktemp)
          printf '%s\n' "${files}" > "${list}"
          heavy=false
          native=false
          while IFS= read -r f; do
            [ -z "${f}" ] && continue
            case "${f}" in
              docs/*|*.md|.github/workflows/pages.yml) ;;
              *) heavy=true ;;
            esac
            case "${f}" in
              internal/ldapserver/*|cmd/labldapd/*|internal/directory/native/*|test/integration/dirsrv/*|test/compatibility/*|test/parity/*|deploy/compose/compose.native*|deploy/docker/labldapd*|deploy/docker/*native*|.github/workflows/ci.yml)
                native=true
                ;;
            esac
          done < "${list}"
          rm -f "${list}"
          echo "heavy=${heavy}" >> "${GITHUB_OUTPUT}"
          echo "native=${native}" >> "${GITHUB_OUTPUT}"
          echo "heavy=${heavy} native=${native}"

  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Enable pnpm (runner Node, for setup-node cache)
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Format (fail on drift)
        run: make format && git diff --exit-code

      - name: Lint
        run: make lint

      - name: Generated-file drift
        run: make generate-drift

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Enable pnpm (runner Node, for setup-node cache)
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Unit tests
        run: make test-unit

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enable pnpm (runner Node, for setup-node cache)
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Frontend production build
        run: make frontend-build

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      # secretscan fails the job on high-confidence committed secrets.
      # govulncheck enforces the critical-vulnerability policy.
      # licensecheck enforces the denylist. None of these tools print
      # secret values or private-registry credentials.
      - name: Security scans
        run: |
          set -euo pipefail
          make test-security 2>&1 | tee security-scan.log

      # Retain scan output as a log artifact only. Do not upload /secrets,
      # .env, password files, or other credential material.
      - name: Upload scan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan
          path: security-scan.log
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: false

  integration:
    name: integration
    needs: [changes]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      # ubuntu-latest does not ship ldap-utils or python3-venv. T-115
      # host clients and the ldap3 venv must be present so those cases
      # cannot skip.
      - name: Install host LDAP and Python tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ldap-utils python3-venv python3-pip
          command -v ldapsearch
          command -v ldapmodify
          command -v ldapwhoami
          python3 --version

      - name: Integration tests (389 DS)
        run: |
          set -euo pipefail
          make test-integration 2>&1 | tee integration.log

      # Log artifact only. Tests redact bind passwords. Do not upload
      # /secrets, .env, password files, or other credential material.
      - name: Upload integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-log
          path: integration.log
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: false

  integration-native:
    name: integration-native
    needs: [changes]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Install host LDAP and Python tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ldap-utils python3-venv python3-pip
          command -v ldapsearch
          command -v ldapwhoami
          python3 --version

      - name: Integration tests (native engine)
        run: |
          set -euo pipefail
          make test-integration-native 2>&1 | tee integration-native.log

      - name: Upload native integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-native-log
          path: integration-native.log
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: false

  image:
    name: image
    needs: [changes]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Bootstrap image
        run: make image-bootstrap

      - name: Control image
        run: make image

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Source SBOM, provenance, architecture check
        run: |
          set -euo pipefail
          make sbom
          make checksums
          make archcheck

      - name: Upload SBOM and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-checksums
          path: |
            dist/sbom/source.cdx.json
            dist/release/provenance.json
            dist/release/SHA256SUMS
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: false
