# Static docs site at https://hilather.github.io/go-lab-ldap-mcp/
#
# Pages must already be enabled with build_type=workflow (Settings →
# Pages → GitHub Actions). GITHUB_TOKEN cannot create that site
# (needs admin). Do not pass enablement: true to configure-pages.

name: pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.fork && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check published site files
        run: |
          set -euo pipefail
          for f in docs/index.html docs/.nojekyll docs/site.css docs/start.html docs/use.html docs/scenario.html docs/ship.html; do
            test -f "$f" || { echo "missing $f" >&2; exit 1; }
          done

      # GET only. Creating the Pages site requires admin; this token
      # cannot do that (see workflow header).
      - name: Require Pages GitHub Actions source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! build=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type); then
            echo "GitHub Pages is not enabled. An admin must run:" >&2
            echo "  gh api -X POST repos/${GITHUB_REPOSITORY}/pages -f build_type=workflow" >&2
            echo "or Settings → Pages → Source: GitHub Actions." >&2
            exit 1
          fi
          if [ "$build" != "workflow" ]; then
            echo "GitHub Pages build_type is ${build}, want workflow." >&2
            echo "Settings → Pages → Source: GitHub Actions." >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
