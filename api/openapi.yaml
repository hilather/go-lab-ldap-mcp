components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Static lab token from a secret file (OD-013). Compared in constant
        time. Only the non-secret token ID is exposed after authentication.
        Scopes: directory:read, directory:write, directory:password,
        lab:reset, lab:export, schema:read, audit:read.
    cookieAuth:
      type: apiKey
      in: cookie
      name: labldap_session
      description: |
        Opaque in-memory session cookie. HttpOnly, SameSite=Strict,
        Secure when TLS, Path=/. Cookie-authenticated mutations require
        header X-CSRF-Token and a valid Origin.
  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
    GroupID:
      name: id
      in: path
      required: true
      schema:
        type: string
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Quoted revision hex
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
      description: Required for cookie-authenticated unsafe methods
  responses:
    BadRequest:
      description: Invalid JSON or field error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing, malformed, or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://labldap.dev/problems/auth
            title: authentication required
            status: 401
            extensions:
              requestId: 00000000000000000000000000000000
    Forbidden:
      description: Missing scope, CSRF, or Origin
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Password or bind-test rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Unknown resource
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Duplicate or in-progress operation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: If-Match revision mismatch
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [live, ready, not_ready]
    BuildInfo:
      type: object
      additionalProperties: false
      required: [version, revision, time, component]
      properties:
        version:
          type: string
        revision:
          type: string
        time:
          type: string
        component:
          type: string
    Capabilities:
      type: object
      additionalProperties: false
      required: [engineVendor, engineVersion, adapterVersion, transports, plugins, passwordScheme, controls, requiredOK]
      properties:
        engineVendor:
          type: string
        engineVersion:
          type: string
        adapterVersion:
          type: string
        transports:
          type: array
          items:
            type: string
        plugins:
          type: array
          items:
            type: string
        passwordScheme:
          type: string
        controls:
          type: array
          items:
            type: string
        requiredOK:
          type: boolean
    Baseline:
      type: object
      additionalProperties: false
      required: [expectedRevision, appliedRevision, controlRevision, match]
      properties:
        expectedRevision:
          type: string
        appliedRevision:
          type: string
        controlRevision:
          type: string
        markerDN:
          type: string
        applyVersion:
          type: string
        appliedAt:
          type: string
        match:
          type: boolean
    SessionCreate:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          format: password
          description: Static token secret. Never logged or returned.
    SessionCreated:
      type: object
      additionalProperties: false
      required: [csrfToken]
      properties:
        csrfToken:
          type: string
    SessionView:
      type: object
      additionalProperties: false
      required: [id, kind, scopes, expiresAt]
      properties:
        id:
          type: string
          description: Non-secret session ID
        kind:
          type: string
          enum: [session]
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        expiresAt:
          type: string
          format: date-time
    Scope:
      type: string
      enum:
        - directory:read
        - directory:write
        - directory:password
        - lab:reset
        - lab:export
        - schema:read
        - audit:read
    AttrKV:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string
    User:
      type: object
      additionalProperties: false
      required: [id, uid, dn, enabled, objectClasses, attributes, revision]
      properties:
        id:
          type: string
        uid:
          type: string
        dn:
          type: string
        enabled:
          type: boolean
        objectClasses:
          type: array
          items:
            type: string
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/AttrKV"
        groups:
          type: array
          items:
            type: string
        revision:
          type: string
    UserSpec:
      type: object
      additionalProperties: false
      required: [id, password]
      properties:
        id:
          type: string
        uid:
          type: string
        enabled:
          type: boolean
        password:
          type: string
          format: password
        attributes:
          type: object
          additionalProperties:
            type: string
    UserPatch:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        attributes:
          type: object
          additionalProperties:
            type: string
    UserPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        nextCursor:
          type: string
    MemberRef:
