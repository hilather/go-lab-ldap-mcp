# Persistent /data for the 389 DS rollback stack. Merge with compose.389ds.yaml:
#   docker compose -f compose.389ds.yaml -f compose.389ds-persistent.yaml up
#
# Ordinary restart keeps runtime entries. Soft reset (REST/MCP lab:reset)
# restores the compiled baseline and does not remove the volume.
# Volume removal is a destructive operator action (make compose-reset /
# docker compose down -v). It is not exposed through REST or MCP.
volumes:
  directory-data:
