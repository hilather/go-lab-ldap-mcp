# Ephemeral /data. Default make compose-up overlay (native labldapd).
#
# A tmpfs-backed Docker volume is used so restart remounts empty.
# Contents vanish when the volume is unmounted or removed.
#
# Size stays 2GiB (RQ-5). UID/GID 65532 match the labldapd runtime user.
# 389 rollback uses compose.389ds-ephemeral.yaml (uid 389, same 2GiB).
#
# docker compose restart remounts this volume empty.
#
# Host swap can still persist tmpfs pages unless the host is configured
# otherwise (non-negotiable 7). Do not treat ephemeral as forensic wipe.
volumes:
  directory-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=2147483648,uid=65532,gid=65532,mode=0750

