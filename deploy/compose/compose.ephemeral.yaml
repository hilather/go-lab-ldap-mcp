# Ephemeral /data (default make compose-up). Native labldapd engine.
#
# A tmpfs-backed Docker volume holds /data/labldapd.bolt. Contents vanish
# when the volume is unmounted or removed. docker compose restart remounts
# this volume empty.
#
# Size is 256Mi: the native engine stores a single bbolt file. UID/GID
# 65532 match the labldapd runtime user. The 389 DS rollback overlay is
# compose.389ds-ephemeral.yaml (2GiB, uid 389).
#
# Host swap can still persist tmpfs pages unless the host is configured
# otherwise (non-negotiable 7). Do not treat ephemeral as forensic wipe.
volumes:
  directory-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=268435456,uid=65532,gid=65532,mode=0750
