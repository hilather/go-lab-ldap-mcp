# Legacy alias of compose.ephemeral.yaml. Prefer `make compose-up`
# (compose.yaml + compose.ephemeral.yaml). Size stays 2GiB (RQ-5).
# UID/GID 65532 match the labldapd runtime user.
#
# Host swap can still persist tmpfs pages unless the host is configured
# otherwise (non-negotiable 7). Do not treat ephemeral as forensic wipe.
volumes:
  directory-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=2147483648,uid=65532,gid=65532,mode=0750
