# LabLDAP Compose (T-110+). Default overlay is ephemeral tmpfs-backed /data.
# Persistent: docker compose -f compose.yaml -f compose.persistent.yaml
#
# Control is labldap-control:dev. It never receives Directory Manager and
# never mounts the Docker socket. Host publishes bind loopback only.
#
# Resource guidance (not enforced on all Compose implementations):
#   directory  512Mi / 1 CPU
#   control    256Mi
#   bootstrap  256Mi (one-shot)
#
# Minimum: Docker Engine 24+ and Compose v2.24+ (OD-020).
name: labldap

networks:
  lab:

volumes:
  directory-data:
  control-secrets:

services:
  # Non-swarm Compose ignores secrets uid/gid/mode. Copy 0600 host files
  # into a volume owned by the control uid so they are 0400 inside.
  # make compose-up --force-recreates this one-shot after secret rotation.
  secret-prep:
    image: labldap-control:dev
    user: "0:0"
    network_mode: none
    volumes:
      - ${LABLDAP_SECRETS_DIR:-../../secrets}/runtime-ldap:/in/runtime-ldap:ro
      - ${LABLDAP_SECRETS_DIR:-../../secrets}/token-admin:/in/token-admin:ro
      - ${LABLDAP_SECRETS_DIR:-../../secrets}/user-alice:/in/user-alice:ro
      - control-secrets:/out
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for f in runtime-ldap token-admin user-alice; do
          cp "/in/$$f" "/out/$$f"
          chown 65532:65532 "/out/$$f"
          chmod 0400 "/out/$$f"
        done
    restart: "no"
  directory:
    image: quay.io/389ds/dirsrv@sha256:f2851654c5df545cd893d84bea8d08c28dc25f0930493fbfed1d8a6eacf657f7
    hostname: directory
    networks: [lab]
    env_file:
      - path: ${LABLDAP_DIRECTORY_ENVFILE:-../../secrets/directory.env}
        required: true
    volumes:
      - directory-data:/data
    ports:
      - "127.0.0.1:3389:3389"
      - "127.0.0.1:3636:3636"
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "test -f /data/config/container.inf && test -S /data/run/slapd-localhost.socket"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  bootstrap:
    image: labldap-bootstrap:dev
    hostname: bootstrap
    networks: [lab]
    depends_on:
      directory:
        condition: service_healthy
    volumes:
      # Shared /data is read-only. Bootstrap must not write engine state.
      - directory-data:/data:ro
      - ${LABLDAP_SCENARIO_FILE:-./scenario.yaml}:/config/scenario.yaml:ro
      - ${LABLDAP_SECRETS_DIR:-../../secrets}/runtime-ldap:/run/secrets/runtime-ldap:ro
      - ${LABLDAP_SECRETS_DIR:-../../secrets}/token-admin:/run/secrets/token-admin:ro
      - ${LABLDAP_SECRETS_DIR:-../../secrets}/user-alice:/run/secrets/user-alice:ro
      - ${LABLDAP_DM_PASSWORD_FILE:-../../secrets/dm.pw}:/run/secrets/dm.pw:ro
      - ${LABLDAP_TLS_CA:-../../secrets/tls/ca.crt}:/run/tls/ca.crt:ro
    command:
      - apply
      - --config
      - /config/scenario.yaml
      - --directory-manager-password-file
      - /run/secrets/dm.pw
      - --ldap-url
      - ldaps://directory:3636
      - --directory-host
      - directory
      - --directory-ca-file
      - /run/tls/ca.crt
      - --dsconf-instance
      - localhost
    restart: "no"

  control:
    image: labldap-control:dev
    hostname: control
    networks: [lab]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      secret-prep:
        condition: service_completed_successfully
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1777,size=16m
    environment:
      LABLDAP_LDAP_URL: ldaps://directory:3636
      LABLDAP_DIRECTORY_HOST: directory
      LABLDAP_DIRECTORY_CA_FILE: /run/tls/ca.crt
    volumes:
      - ${LABLDAP_SCENARIO_FILE:-./scenario.yaml}:/config/scenario.yaml:ro
      - control-secrets:/run/secrets:ro
      - ${LABLDAP_TLS_CA:-../../secrets/tls/ca.crt}:/run/tls/ca.crt:ro
    command:
      - serve
      - --config
      - /config/scenario.yaml
      - --ldap-url
      - ldaps://directory:3636
      - --directory-ca-file
      - /run/tls/ca.crt
      - --directory-host
      - directory
    ports:
      - "127.0.0.1:8443:8443"
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "-", "https://127.0.0.1:8443/health"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
