# LabLDAP Compose. Default engine is native labldapd (v0.3.0+).
# 389 DS oracle/rollback:
#   docker compose -f compose.389ds.yaml -f compose.389ds-ephemeral.yaml
# Persistent native:
#   docker compose -f compose.yaml -f compose.persistent.yaml
#
# Control is labldap-control:dev. It never receives Directory Manager and
# never mounts the Docker socket. Host publishes bind loopback only.
#
# labldapd self-applies the engine plan (suffix, TLS materials, password
# policy, plugin hooks) at start; bootstrap keeps the LDAP data plane as
# Directory Manager. Native mode has no 389 CLI tooling, no LDAPI socket,
# and no shared /data mount. TLS is the lab CA directory certificate
# mounted as files.
#
# Resource guidance (not enforced on all Compose implementations):
#   directory  256Mi / 1 CPU
#   control    256Mi
#   bootstrap  256Mi (one-shot)
#
# Minimum: Docker Engine 24+ and Compose v2.24+ (OD-020).
name: labldap

networks:
  lab:

volumes:
  directory-data:
  control-secrets:
  directory-secrets:

services:
  # Non-swarm Compose ignores secrets uid/gid/mode. Copy 0600 host files
  # into a volume owned by the control uid so they are 0400 inside.
  # make compose-up --force-recreates this one-shot after secret rotation.
  secret-prep:
    image: labldap-control:dev
    user: "0:0"
    network_mode: none
    volumes:
      - ${LABLDAP_SECRETS_DIR:-../../secrets}/runtime-ldap:/in/runtime-ldap:ro
      - ${LABLDAP_SECRETS_DIR:-../../secrets}/token-admin:/in/token-admin:ro
      - ${LABLDAP_SECRETS_DIR:-../../secrets}/user-alice:/in/user-alice:ro
      - control-secrets:/out
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for f in runtime-ldap token-admin user-alice; do
          cp "/in/$$f" "/out/$$f"
          chown 65532:65532 "/out/$$f"
          chmod 0400 "/out/$$f"
        done
    restart: "no"

  # DM password and the directory TLS key/cert, copied to 0400/65532.
  # Host secret files are 0600 and unreadable by the non-root engine uid.
  native-secret-prep:
    image: labldapd:dev
    user: "0:0"
    network_mode: none
    volumes:
      - ${LABLDAP_DM_PASSWORD_FILE:-../../secrets/dm.pw}:/in/dm.pw:ro
      - ${LABLDAP_TLS_DIR:-../../secrets/tls}/directory.crt:/in/directory.crt:ro
      - ${LABLDAP_TLS_DIR:-../../secrets/tls}/directory.key:/in/directory.key:ro
      - directory-secrets:/out
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for f in dm.pw directory.crt directory.key; do
          cp "/in/$$f" "/out/$$f"
          chown 65532:65532 "/out/$$f"
          chmod 0400 "/out/$$f"
        done
    restart: "no"

  directory:
    image: labldapd:dev
    hostname: directory
    networks: [lab]
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1777,size=16m
    depends_on:
      native-secret-prep:
        condition: service_completed_successfully
    volumes:
      - directory-data:/data
      - directory-secrets:/run/secrets:ro
      - ${LABLDAP_SCENARIO_FILE:-./scenario.yaml}:/config/scenario.yaml:ro
    command:
      - serve
      - --config
      - /config/scenario.yaml
      - --data-dir
      - /data
      # In-container listeners bind all interfaces so Compose peers on the
      # lab network reach them; host publishes stay 127.0.0.1.
      - --listen
      - 0.0.0.0:3389
      - --ldaps-listen
      - 0.0.0.0:3636
      - --tls-cert-file
      - /run/secrets/directory.crt
      - --tls-key-file
      - /run/secrets/directory.key
      - --directory-manager-password-file
      - /run/secrets/dm.pw
      # Health listener stays loopback inside the container; never published.
      - --health-listen
      - 127.0.0.1:8389
    ports:
      - "127.0.0.1:3389:3389"
      - "127.0.0.1:3636:3636"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8389/health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  bootstrap:
    image: labldap-bootstrap:dev
    hostname: bootstrap
    networks: [lab]
    depends_on:
      directory:
        condition: service_healthy
    # Native bootstrap is LDAP-only: no 389 CLI flags and no /data mount.
    volumes:
      - ${LABLDAP_SCENARIO_FILE:-./scenario.yaml}:/config/scenario.yaml:ro
      - ${LABLDAP_SECRETS_DIR:-../../secrets}/runtime-ldap:/run/secrets/runtime-ldap:ro
      - ${LABLDAP_SECRETS_DIR:-../../secrets}/token-admin:/run/secrets/token-admin:ro
      - ${LABLDAP_SECRETS_DIR:-../../secrets}/user-alice:/run/secrets/user-alice:ro
      - ${LABLDAP_DM_PASSWORD_FILE:-../../secrets/dm.pw}:/run/secrets/dm.pw:ro
      - ${LABLDAP_TLS_CA:-../../secrets/tls/ca.crt}:/run/tls/ca.crt:ro
    command:
      - apply
      - --config
      - /config/scenario.yaml
      - --directory-manager-password-file
      - /run/secrets/dm.pw
      - --ldap-url
      - ldaps://directory:3636
      - --directory-host
      - directory
      - --directory-ca-file
      - /run/tls/ca.crt
    restart: "no"

  control:
    image: labldap-control:dev
    hostname: control
    networks: [lab]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      secret-prep:
        condition: service_completed_successfully
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1777,size=16m
    environment:
      LABLDAP_LDAP_URL: ldaps://directory:3636
      LABLDAP_DIRECTORY_HOST: directory
      LABLDAP_DIRECTORY_CA_FILE: /run/tls/ca.crt
    volumes:
      - ${LABLDAP_SCENARIO_FILE:-./scenario.yaml}:/config/scenario.yaml:ro
      - control-secrets:/run/secrets:ro
      - ${LABLDAP_TLS_CA:-../../secrets/tls/ca.crt}:/run/tls/ca.crt:ro
    command:
      - serve
      - --config
      - /config/scenario.yaml
      - --ldap-url
      - ldaps://directory:3636
      - --directory-ca-file
      - /run/tls/ca.crt
      - --directory-host
      - directory
    ports:
      # Default loopback. Set LABLDAP_CONTROL_PUBLISH=0.0.0.0 to reach the UI by host IP.
      - "${LABLDAP_CONTROL_PUBLISH:-127.0.0.1}:8443:8443"
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "-", "https://127.0.0.1:8443/health"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
